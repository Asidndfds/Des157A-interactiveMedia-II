<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Version of Everypicture</title>
     <!-- normalize -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Gluten:wght@100..900&display=swap" rel="stylesheet">

    <!-- stylesheet -->
     <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
     <p id="intro">Cry over sweet memories with me.</p>
    <main id='photos'>
        <img id='phos' src='images/bfsdesk.jpg' alt='bf desk photo' width="600" height="800">
        <img id='pause' src='images/pause.png' alt="pause" width="402" height="402">
        <p id="caption">Love letter displaying on the wall of boyfriend's bedroom</p>

        <div id="display">
            <img src="images/bfsdesk.jpg" alt="bf desk photo" width="600" height="800"><img src="images/cousinbrother.jpg" alt="cousin brother" width="600" height="800"><img src="images/grandmagift.jpg" alt="grandma and gift" width="600" height="800"><img src="images/laughtogether.jpg" alt="laugh together" width="600" height="800"><img src="images/sister.jpg" alt="sister" width="600" height="800">
        </div>
        <img id="phonecase" src="images/phone.png" alt="phone case" width="1200" height="750">
        <img id="blackend" src="images/black.jpg" alt="black part of phone" width="1206" height="1095">
    </main>
        <p id="hovertext">
            <span class="text1">Click anywhere to have to closer peek</span><br class="text2"><br class="text2">
            <span class="text2">Hover over the changing photo to have a slower look</span>
        </p>
        <img id='click' src="images/finger.png" alt="click finger" width="402" height="402">

</body>
</html>
